plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.hackerrank'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // API de OpenTelemetry para los spans y metricas propios. El SDK lo provee
    // el javaagent en runtime: aca solo entra la API, no una implementacion.
    implementation platform('io.opentelemetry:opentelemetry-bom:1.65.0')
    implementation 'io.opentelemetry:opentelemetry-api'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations:2.31.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
    reports {
        junitXml.required = true
    }

    // Gradle por defecto solo informa si el build paso o fallo. Se declaran los
    // eventos para poder leer por consola que se ejecuto y por que fallo, sin
    // tener que abrir el reporte HTML.
    testLogging {
        events 'passed', 'skipped', 'failed'
        // Granularidad 2 arranca el nombre en la clase: sin esto cada linea
        // viene prefijada por el executor que la corrio, que no aporta nada.
        displayGranularity = 2
        showStandardStreams = false

        exceptionFormat = 'full'
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }

    // Resumen final: el detalle por test no deja ver el total de un vistazo.
    afterSuite { descriptor, result ->
        if (descriptor.parent == null) {
            println "\nResultado: ${result.resultType} | " +
                    "${result.testCount} tests, " +
                    "${result.successfulTestCount} exitosos, " +
                    "${result.failedTestCount} fallidos, " +
                    "${result.skippedTestCount} salteados"
        }
    }
}
