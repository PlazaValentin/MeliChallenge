server.port=8080

# Origen del frontend habilitado por CORS (ver DECISIONS.md, "Contrato de la
# API"). Es el puerto que declara frontend/vite.config.js: si el frontend se
# sirve desde otro lado, hay que cambiarlo aca.
app.cors.allowed-origin=http://localhost:3000

# Carga de datos de arranque (ver DECISIONS.md). Poner en false para levantar
# el backend sin datos precargados.
app.seed.enabled=true

# Scoring de importancia de preguntas (ver DECISIONS.md, "Scoring de importancia").
# Los tramos (tiers) se leen en orden; el ultimo tramo de cada lista no declara
# upper-bound: es el "y mas", sin tope. waiting-time-hours-tiers usa horas desde
# la creacion de la pregunta. order-amount-tiers usa el total del pedido.

app.scoring.waiting-time-hours-tiers[0].upper-bound=24
app.scoring.waiting-time-hours-tiers[0].points=0
app.scoring.waiting-time-hours-tiers[1].upper-bound=72
app.scoring.waiting-time-hours-tiers[1].points=20
app.scoring.waiting-time-hours-tiers[2].upper-bound=168
app.scoring.waiting-time-hours-tiers[2].points=40
app.scoring.waiting-time-hours-tiers[3].points=60

app.scoring.order-amount-tiers[0].upper-bound=49999.99
app.scoring.order-amount-tiers[0].points=0
app.scoring.order-amount-tiers[1].upper-bound=149999.99
app.scoring.order-amount-tiers[1].points=15
app.scoring.order-amount-tiers[2].upper-bound=499999.99
app.scoring.order-amount-tiers[2].points=25
app.scoring.order-amount-tiers[3].points=40

app.scoring.order-status-points.PENDING=10
app.scoring.order-status-points.CONFIRMED=10
app.scoring.order-status-points.SHIPPED=5
app.scoring.order-status-points.DELIVERED=0
app.scoring.order-status-points.CANCELLED=30

app.scoring.question-status-points.OPEN=15
app.scoring.question-status-points.ANSWERED=5
app.scoring.question-status-points.RESOLVED=0

app.scoring.keyword-points.urgente=10
app.scoring.keyword-points.roto=10
app.scoring.keyword-points.incompleto=10
app.scoring.keyword-points.enojado=10
app.scoring.keyword-points.estafa=10
app.scoring.keyword-points.defectuoso=10
app.scoring.keyword-points.pesimo=10
app.scoring.keyword-points.indignado=10
app.scoring.keyword-points.reclamo=10
app.scoring.keyword-points.devolucion=10

# Techo del factor de palabras clave: por mas palabras distintas que traiga el
# texto, el factor no supera este valor. Sin tope, un diccionario amplio lo
# volveria el factor dominante por encima del tiempo de espera (60).
app.scoring.keyword-max-points=50

app.scoring.classification-thresholds.medium-from=50
app.scoring.classification-thresholds.high-from=90
app.scoring.classification-thresholds.critical-from=130

# Notificaciones (ver DECISIONS.md, "Notificaciones"). Se avisa desde esta
# clasificacion hacia arriba, evaluada al crear la pregunta.
app.notifications.minimum-priority=HIGH

# Un flag por canal: el canal existe como bean solo si esta en true, asi que
# agregar uno nuevo no obliga a tocar los existentes ni el codigo que los usa.
app.notifications.channels.email.enabled=true
app.notifications.channels.slack.enabled=false
app.notifications.channels.sms.enabled=false
